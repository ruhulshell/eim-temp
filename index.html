p:['DOL (Direct On Line) পদ্ধতিতে মোটর সরাসরি পূর্ণ ভোল্টেজে চালু হয়, ছোট ও মাঝারি মোটরে ব্যবহৃত হয়।','স্টার্টিং কারেন্ট রেটেড কারেন্টের প্রায় ৬–৮ গুণ হতে পারে।','হোল্ডিং কন্টাক্ট: কন্টাক্টরের NO অক্সিলিয়ারি স্টার্ট বাটনের সমান্তরালে থাকে, তাই বাটন ছাড়লেও মোটর চলে।','ফরওয়ার্ড-রিভার্স কন্ট্রোলে দুই কন্টাক্টর একসাথে চালু হলে ফেজ শর্ট হয়, তাই ইন্টারলক বাধ্যতামূলক।','স্টার-ডেল্টায় স্টার সংযোগে স্টার্টিং কারেন্ট DOL-এর প্রায় এক-তৃতীয়াংশ।'],

tr:'আলো পড়লেই প্যানেল বিদ্যুৎ তৈরি করে, বন্ধ করা যায় না। লোড অবস্থায় MC4 কানেক্টর খুলবেন না; DC আর্ক ভয়ংকর।',

{q:'প্যানেল সিরিজে লাগালে কী যোগ হয়?',o:['কারেন্ট','ভোল্টেজ','কিছুই না'],a:1,e:'সিরিজে ভোল্টেজ যোগ হয়, কারেন্ট একই থাকে।'}]},

];
const $=s=>document.querySelector(s);
let done={};try{done=JSON.parse(localStorage.getItem('done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('done',JSON.stringify(done))}catch(e){}};
function theme(t){document.documentElement.dataset.bsTheme=t;try{localStorage.setItem('th',t)}catch(e){}}
try{theme(localStorage.getItem('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}catch(e){}
$('#th').onclick=()=>theme(document.documentElement.dataset.bsTheme=='dark'?'light':'dark');
function closeSide(){const o=$('#side');if(o.classList.contains('show')||o.classList.contains('showing')){bootstrap.Offcanvas.getOrCreateInstance(o).hide()}}
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))closeSide()});
$('#rs').onclick=()=>{if(confirm('সব প্রগ্রেস মুছে ফেলবেন?')){done={};save();try{localStorage.removeItem('last')}catch(e){}closeSide();if(location.hash!='#t1')location.hash='#t1';else render()}};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function nav(cur){let h='',m='';T.forEach(x=>{if(x.m!=m){m=x.m;h+=`<div class="mod">${m}</div>`}h+=`<a href="#${x.id}" class="${x.id==cur?'on ':''}${done[x.id]?'ok':''}">${x.t}</a>`});
h+=`<div class="mod">চূড়ান্ত</div><a href="#final" class="${cur=='final'?'on ':''}${done.final?'ok':''}">চূড়ান্ত কুইজ</a>`;$('#nav').innerHTML=h;
const c=T.filter(x=>done[x.id]).length;$('#bar').style.width=(c/T.length*100)+'%';$('#pt').textContent=bn(c)+'/'+bn(T.length)+' টপিক সম্পন্ন'}
function table(r){return`<div class="table-responsive"><table class="table table-bordered table-sm"><thead class="table-light"><tr>${r[0].map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function quiz(qs,onDone){let ans=0,ok=0;const el=document.createElement('div');
el.innerHTML=qs.map((q,i)=>`<div class="mb-3" data-q="${i}"><p class="fw-semibold mb-1">${bn(i+1)}. ${q.q}</p>${q.o.map((o,j)=>`<button class="btn btn-outline-secondary opt" data-j="${j}">${o}</button>`).join('')}<div class="fb small mt-1"></div></div>`).join('')+'<div class="sc fw-bold"></div>';
el.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const box=b.closest('[data-q]');if(box.dataset.d)return;box.dataset.d=1;
const q=qs[box.dataset.q],j=+b.dataset.j,r=j==q.a;ans++;if(r)ok++;
box.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k==q.a)x.className='btn btn-success opt';else if(k==j)x.className='btn btn-danger opt'});
box.querySelector('.fb').innerHTML=(r?'✅ সঠিক! ':'❌ ভুল। ')+q.e;
if(ans==qs.length){el.querySelector('.sc').textContent=`স্কোর: ${bn(ok)}/${bn(qs.length)}`;onDone&&onDone(ok,qs.length)}};return el}
function render(){let last=null;try{last=localStorage.getItem('last')}catch(e){}
const id=location.hash.slice(1)||last||'t1',main=$('#main');main.innerHTML='';closeSide();
try{localStorage.setItem('last',id)}catch(e){}
if(id=='final'){main.innerHTML='<h2>চূড়ান্ত কুইজ</h2><p class="text-secondary">সব টপিক থেকে প্রশ্ন।</p>';
main.appendChild(quiz(T.flatMap(x=>x.q),()=>{done.final=1;save();nav(id)}));nav(id);scrollTo(0,0);return}
const i=Math.max(0,T.findIndex(x=>x.id==id)),x=T[i];
main.innerHTML=`<small class="text-secondary">${x.m}</small><h2 class="fw-bold">${x.t}</h2>
<h5 class="mt-4">🌍 আগে একটি উদাহরণ</h5><div class="ex">${x.ex}</div>
<h5 class="mt-4">📌 মূল ধারণা</h5><ul>${x.p.map(p=>`<li>${p}</li>`).join('')}</ul>${table(x.tb)}
<div class="co k"><b>মূল কথা (Key Takeaway):</b> ${x.k}</div>
<div class="co t"><b>সাধারণ ভুল (Common Trap):</b> ${x.tr}</div>
<div class="co m"><b>মনে রাখার কৌশল (Memory Trick):</b> ${x.m}</div>
<h5 class="mt-4">🧠 নিজেকে যাচাই করুন</h5><div id="qz"></div>
<div class="d-flex justify-content-between mt-4">${i>0?`<a class="btn btn-outline-primary" href="#${T[i-1].id}">← আগের</a>`:'<span></span>'}<a class="btn btn-primary" href="#${i<T.length-1?T[i+1].id:'final'}">পরের →</a></div>`;
$('#qz').appendChild(quiz(x.q,()=>{done[x.id]=1;save();nav(id)}));nav(id);scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script>
</body>
